[project]
name = "ai-code-review"
version = "0.1.0"
description = "AI Code Review"
requires-python = ">=3.10"
dependencies = [
    "crewai==1.15.15",
    "fastapi>=0.115,<1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
