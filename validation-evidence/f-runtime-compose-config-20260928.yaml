name: projectos-wanfa-live-l2-todo-20260927
services:
  backend:
    build:
      context: /Users/coinloner/projectOS/projects/live-l2-20260926-rerun/wanfa-live-l2-todo-20260927/workspace
      dockerfile: ops/Dockerfile
    cap_drop:
      - ALL
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      PYTHONPATH: /workspace/backend
      TASK_DB_PATH: /data/tasks.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      timeout: 3s
      interval: 3s
      retries: 20
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8000
        published: "18080"
        protocol: tcp
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    user: 65532:65532
    volumes:
      - type: volume
        source: todo-data
        target: /data
        volume: {}
    working_dir: /workspace/backend
  frontend:
    build:
      context: /Users/coinloner/projectOS/projects/live-l2-20260926-rerun/wanfa-live-l2-todo-20260927/workspace
      dockerfile: frontend/Dockerfile
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      timeout: 3s
      interval: 3s
      retries: 20
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "18081"
        protocol: tcp
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    user: 65532:65532
    working_dir: /workspace/frontend
networks:
  default:
    name: projectos-wanfa-live-l2-todo-20260927_default
volumes:
  todo-data:
    name: projectos-wanfa-live-l2-todo-20260927_todo-data
